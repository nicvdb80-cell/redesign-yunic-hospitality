<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yunic Hospitality — Under Maintenance</title>
<meta name="description" content="Yunic Hospitality is quietly at work. Our site is under maintenance. Private chefs and culinary experiences in Bali and beyond.">
<meta name="robots" content="noindex, follow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F7F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: only light;
    --paper:#F7F7F4;--ink:#252420;--body:#56554F;
    --gold:#A48760;--gold-deep:#8A6D4B;--line:rgba(41,39,31,.16);
    --serif:'Cormorant SC',serif;--sans:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{background-color:var(--paper)}
  body{
    min-height:100svh;color:var(--body);
    font:300 1.0625rem/1.75 var(--sans);
    -webkit-font-smoothing:antialiased;letter-spacing:.005em;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:var(--paper) url("marble-white-v2.jpg") center center / cover no-repeat;
  }
  .wrap{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:1.6rem;
    animation:fade 1.1s cubic-bezier(.19,1,.22,1)}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .logo{width:76px;height:76px;object-fit:contain;margin-bottom:.4rem}
  .brand{font:400 1rem/1 var(--serif);letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}
  .rule{width:2.6rem;height:1px;background:var(--gold);margin:.2rem 0}
  h1{font:400 clamp(2.1rem,6vw,3.2rem)/1.12 var(--serif);letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
  .sub{font-size:1.05rem;max-width:34ch}
  .contact{margin-top:.6rem;font:500 .68rem/1.9 var(--sans);letter-spacing:.22em;text-transform:uppercase;
    color:var(--gold-deep);display:flex;flex-direction:column;gap:.35rem;align-items:center}
  .contact a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .3s,border-color .3s}
  .contact a:hover{color:var(--ink);border-color:var(--gold)}
  .soon{margin-top:1.2rem;font:400 1.15rem/1 var(--serif);letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
  @media (prefers-color-scheme: dark){
    :root{--paper:#F7F7F4;--ink:#252420;--body:#56554F;--gold:#A48760;--gold-deep:#8A6D4B}
    html{background-color:#F7F7F4 !important}
    body{color:#56554F !important}
    body::before{background:#F7F7F4 url("marble-white-v2.jpg") center center / cover no-repeat !important}
    .brand,h1,.soon{color:#252420 !important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="yunic-logo-gold.png" alt="Yunic Hospitality">
    <div class="brand">Yunic Hospitality</div>
    <div class="rule"></div>
    <h1>We are quietly at work.</h1>
    <p class="sub">Our site is under maintenance. We will be back very soon.</p>
    <div class="contact">
      <span>If you need us</span>
      <a href="mailto:yunicfb@gmail.com">yunicfb@gmail.com</a>
      <a href="https://wa.me/6281994807407">WhatsApp +62 819 9480 7407</a>
    </div>
    <div class="soon">See you soon</div>
  </div>
</body>
</html>
