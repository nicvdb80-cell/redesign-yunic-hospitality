<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Yunic Hospitality — Under Maintenance</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="yunic-logo-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500&family=Cormorant:ital,wght@1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --paper:#f7f4ee;
    --ink:#1c1a16;
    --gold:#a9895f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper) url('marble-white.jpg') center/cover no-repeat fixed;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  .wrap{max-width:560px;}
  .logo{width:64px;height:64px;object-fit:contain;margin-bottom:32px;}
  h1{
    font-family:'Cormorant SC', serif;
    font-weight:400;
    font-size:clamp(28px,5vw,42px);
    letter-spacing:0.02em;
    margin-bottom:20px;
  }
  h1 em{
    font-family:'Cormorant', serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold);
  }
  p{
    font-size:16px;
    line-height:1.7;
    color:#4a463e;
    margin-bottom:8px;
  }
  a{
    color:var(--gold);
    text-decoration:none;
    border-bottom:1px solid rgba(169,137,95,0.4);
  }
  a:hover{border-bottom-color:var(--gold);}
  .motto{
    margin-top:40px;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#8a8578;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="yunic-logo-gold.png" alt="Yunic Hospitality" class="logo">
    <h1>We are <em>quietly</em><br>at work.</h1>
    <p>Our site is under maintenance.</p>
    <p>If you need us, write to <a href="mailto:yunichospitality@gmail.com">yunichospitality@gmail.com</a></p>
    <p class="motto">See you soon</p>
  </div>
</body>
</html>
